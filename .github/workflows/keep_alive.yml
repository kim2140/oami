# GitHub Actions를 통해 주기적으로 Streamlit 앱에 트래픽을 발생시켜 수면 상태를 방지하는 워크플로우입니다.
name: Keep Streamlit App Alive

# 어떤 조건에서 이 워크플로우를 실행할지 정의합니다.
on:
  schedule:
    # cron 표현식을 사용하여 실행 주기를 설정합니다.
    # 아래 설정은 매 10시간마다 0분에 실행된다는 의미입니다. ('0 */10 * * *')
    # UTC 기준이므로 한국 시간과 무관하게 10시간 간격으로 정확히 동작합니다.
    # 앱이 12시간마다 잠들기 때문에, 여유를 두고 10시간마다 실행하여 앱이 잠들지 않도록 방지합니다.
    - cron: '0 */10 * * *'
  # 스케줄 외에도 필요할 때 GitHub 웹사이트에서 수동으로 버튼을 눌러 실행할 수 있도록 허용합니다.
  workflow_dispatch:

# 실행할 작업(Job)들을 정의합니다.
jobs:
  ping:
    # 최신 우분투(Ubuntu) 환경의 가상 서버에서 작업을 실행합니다.
    runs-on: ubuntu-latest
    
    # 작업 내에서 순차적으로 실행될 단계(Steps)들입니다.
    steps:
      - name: Ping Streamlit App
        # curl 명령어를 사용하여 앱 URL에 접속(HTTP GET 요청)하여 트래픽을 발생시킵니다.
        # -s: 진행률이나 에러 메시지를 숨깁니다. (Silent mode)
        # -o /dev/null: 받아온 웹페이지 내용(HTML)은 저장하지 않고 버립니다. 리소스 낭비를 막기 위함입니다.
        # -w "%{http_code}\n": 정상적으로 접속되었는지 확인하기 위해 HTTP 상태 코드(예: 200)만 출력합니다.
        #
        # [업데이트 내역]: 줄바꿈 및 명령어의 명확한 인식을 위해 리터럴 모드(|)를 적용하였습니다.
        # [주의]: 아래 URL 부분의 'https://kim2140-...' 부분을 본인의 실제 Streamlit 앱 주소로 반드시 변경해야 합니다.
        # [절대 참조 유지]: 이전 로직을 훼손하지 않고 그대로 유지합니다.
        #
        # [추가 업데이트 내역]: Actions 탭에서 워크플로우를 인식하지 못하는 문제를 해결하기 위해,
        # 'set up a workflow yourself' 버튼을 통한 생성 안내를 추가하고, 캡처 화면의 저장소 이름(oami)을 
        # 반영하여 URL 예시를 업데이트하였습니다.
        #
        # [경로 확인 안내]: Actions 탭에서 이 파일이 인식되지 않는다면, 파일이 '.github/workflows/' 폴더 내부에 
        # 정확히 위치해 있는지 Code 탭에서 확인해 주시기 바랍니다.
        #
        # [폴더 꼬임 해결 안내 추가]: 기존 .github 폴더 내부로 직접 진입하여 workflows/keep_alive.yml 로 생성해야
        # 정상적으로 Actions가 인식합니다. 기존 주석과 로직은 변경 없이 모두 추가/유지되었습니다.
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://kim2140-oami.streamlit.app/
          
